version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sikadpro-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - sikadpro-net
    depends_on:
      - mysql
      - redis
    environment:
      - APP_ENV=${APP_ENV:-production}

  nginx:
    image: nginx:alpine
    container_name: sikadpro-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
      - ./docker/nginx/ssl:/etc/nginx/ssl
    networks:
      - sikadpro-net
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: sikadpro-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-sikadpro}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
      MYSQL_USER: ${DB_USERNAME:-sikadpro}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "${DB_PORT:-3306}:3306"
    networks:
      - sikadpro-net
    command:
      - --default-authentication-plugin=mysql_native_password
      - --max-connections=500

  redis:
    image: redis:7-alpine
    container_name: sikadpro-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      - sikadpro-net
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sikadpro-worker
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    networks:
      - sikadpro-net
    depends_on:
      - app
      - redis
      - mysql
    command: php artisan queue:work --queue=default,emails,notifications,reports --tries=3 --timeout=120 --sleep=3
    environment:
      - APP_ENV=${APP_ENV:-production}

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sikadpro-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    networks:
      - sikadpro-net
    depends_on:
      - app
      - mysql
    command: >
      sh -c "while true; do
               php artisan schedule:run --verbose --no-interaction;
               sleep 60;
             done"
    environment:
      - APP_ENV=${APP_ENV:-production}

  soketi:
    image: quay.io/soketi/soketi:1.6-16-alpine
    container_name: sikadpro-soketi
    restart: unless-stopped
    ports:
      - "${SOKETI_PORT:-6001}:6001"
    environment:
      DEBUG: 1
      DEFAULT_APP_ID: ${PUSHER_APP_ID:-sikadpro}
      DEFAULT_APP_KEY: ${PUSHER_APP_KEY:-sikadpro-key}
      DEFAULT_APP_SECRET: ${PUSHER_APP_SECRET:-sikadpro-secret}
    networks:
      - sikadpro-net

volumes:
  mysql-data:
  redis-data:

networks:
  sikadpro-net:
    driver: bridge
