name: eschool_app
description: "eSchool SaaS — Multi-tenant School Management ERP (Flutter mobile)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.1
  bloc: ^9.0.0
  equatable: ^2.0.7

  # Navigation
  go_router: ^16.0.0

  # HTTP
  dio: ^5.9.0
  pretty_dio_logger: ^1.4.0

  # Storage
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3

  # Firebase
  firebase_core: ^3.15.1
  firebase_messaging: ^15.2.7
  flutter_local_notifications: ^18.0.1

  # Real-time Chat
  pusher_channels_flutter: ^2.4.0

  # UI
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  fl_chart: ^0.69.2
  lottie: ^3.3.1
  flutter_svg: ^2.0.16
  google_fonts: ^6.2.1

  # Files & Media
  file_picker: ^8.3.7
  flutter_pdfview: ^1.4.1
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  open_filex: ^4.7.0

  # Scanner (librarian barcode)
  mobile_scanner: ^7.0.1

  # Utils
  intl: ^0.20.2
  timeago: ^3.7.0
  url_launcher: ^6.3.2
  connectivity_plus: ^6.1.5
  package_info_plus: ^8.3.1
  permission_handler: ^11.4.0
  flutter_dotenv: ^5.2.1

  # Payment gateway support
  qr_flutter: ^4.1.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
