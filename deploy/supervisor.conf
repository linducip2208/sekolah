; Sikad Pro — Supervisor Configuration
; Place at: /etc/supervisor/conf.d/sikadpro.conf
;
; After creating:
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl start sikadpro-queue:*
;   sudo supervisorctl start sikadpro-scheduler:*
;   sudo supervisorctl start sikadpro-reverb:*
;
; Check status:
;   sudo supervisorctl status
;
; Restart all:
;   sudo supervisorctl restart sikadpro-queue:* sikadpro-scheduler:* sikadpro-reverb:*

; ==============================================================================
; Program 1: Queue Worker
; Processes background jobs (emails, notifications, exports, reports, etc.)
; ==============================================================================
[program:sikadpro-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/sikadpro/artisan queue:work --sleep=3 --tries=3 --max-time=3600 --max-jobs=100 --rest=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=3
redirect_stderr=true
stdout_logfile=/var/www/sikadpro/storage/logs/worker.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stopwaitsecs=3600
priority=100

; ==============================================================================
; Program 2: Scheduler
; Runs Laravel scheduled tasks (cron replacement)
; Includes: backup, notifications, reminders, IndexNow submissions
; ==============================================================================
[program:sikadpro-scheduler]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/sikadpro/artisan schedule:work
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/sikadpro/storage/logs/scheduler.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3
stopwaitsecs=60
priority=200

; ==============================================================================
; Program 3: Reverb WebSocket Server
; Real-time broadcasting for chat, notifications, and live updates
; ==============================================================================
[program:sikadpro-reverb]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/sikadpro/artisan reverb:start
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/sikadpro/storage/logs/reverb.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3
stopwaitsecs=10
priority=300
