# eSchool SaaS — Nginx Configuration (Production)
# Place at: /etc/nginx/sites-available/eschool
# Then: sudo ln -s /etc/nginx/sites-available/eschool /etc/nginx/sites-enabled/
# Test:  sudo nginx -t && sudo systemctl reload nginx
#
# DNS prerequisite:
#   A    @       YOUR_SERVER_IP
#   A    *       YOUR_SERVER_IP    (wildcard for school subdomains)
#   A    admin   YOUR_SERVER_IP    (super admin portal)

# -------------------------------------------------------------------
# Rate limiting for login endpoints
# -------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;

# -------------------------------------------------------------------
# Upstream: PHP-FPM (standalone — unix socket)
# For Docker deployment, replace with: fastcgi_pass eschool_app:9000;
# -------------------------------------------------------------------
upstream php-fpm {
    server unix:/run/php/php8.3-fpm.sock;
}

# -------------------------------------------------------------------
# Upstream: Reverb WebSocket server
# -------------------------------------------------------------------
upstream reverb {
    server 127.0.0.1:8080;
}

# -------------------------------------------------------------------
# HTTP → HTTPS redirect
# -------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name eschool.app *.eschool.app;

    # Let's Encrypt challenge (skip redirect for ACME)
    location /.well-known/acme-challenge/ {
        root /var/www/eschool/public;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# -------------------------------------------------------------------
# HTTPS server — main application
# -------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name eschool.app *.eschool.app;

    root /var/www/eschool/public;
    index index.php;

    charset utf-8;

    # ---- SSL ------------------------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/eschool.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eschool.app/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ---- Security headers -----------------------------------------------------
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # ---- Upload limit ---------------------------------------------------------
    client_max_body_size 50M;

    # ---- Rate limiting --------------------------------------------------------
    location = /admin/login {
        limit_req zone=login_limit burst=3 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /api/ {
        limit_req zone=api_limit burst=10 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ---- Laravel routing ------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ---- PHP-FPM --------------------------------------------------------------
    location ~ \.php$ {
        fastcgi_pass   php-fpm;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include        fastcgi_params;
        fastcgi_read_timeout 300;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # ---- robots.txt -----------------------------------------------------------
    location = /robots.txt {
        try_files $uri /index.php?$query_string;
        access_log off;
        log_not_found off;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    # ---- Static asset caching (1 year) ----------------------------------------
    location ~* \.(jpg|jpeg|gif|png|webp|ico|css|js|svg|woff|woff2|ttf|eot|map|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---- Block hidden files ---------------------------------------------------
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ---- WebSocket proxy — Reverb / Soketi ------------------------------------
    location /app/ {
        proxy_pass http://reverb;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_cache_bypass $http_upgrade;
    }

    # ---- Gzip compression -----------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   5;
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/x-font-ttf
        font/opentype
        image/svg+xml;

    # ---- Logs -----------------------------------------------------------------
    access_log /var/log/nginx/eschool-access.log;
    error_log  /var/log/nginx/eschool-error.log;
}
